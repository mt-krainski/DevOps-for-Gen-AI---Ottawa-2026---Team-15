# ---- traps ----
#
# A source that shares names, numbers and vocabulary with the claim, and that a
# careless read takes for confirmation. This is the failure the suite most wants to
# catch: topical overlap mistaken for support.

# Pattern: transferred-attribute.
# Careless: 14.7 percent is the figure every search for April 2020 unemployment returns, from authoritative sources.
# Correct: 14.7 percent was the economy-wide rate; the rate for ages 16 to 19 was 31.9 percent.
# Stability: a dated monthly BLS release; historical statistics do not move.
# Source: https://www.bls.gov/opub/ted/youth.htm
# Source: https://www.cnbc.com/2020/05/08/jobs-report-april-2020.html
- description: "refuted trap: 14.7 percent is the economy-wide rate, not the teenage one"
  vars:
    statement: "In April 2020, the United States experienced a teenage unemployment rate of 14.7 percent."
    surroundingContext: "The COVID-19 pandemic created unprecedented disruption to labor markets in the spring of 2020. The April jobs report was striking for the scale of job losses and the breadth of groups affected. Unemployment spiked across the country, affecting workers at every age and experience level."
    expectedVerdict: refuted

# Pattern: near-miss-event.
# Careless: he did win three titles, and his name sits beside 400 and freestyle throughout the results.
# Correct: the third title was the 400m individual medley, not the 400m freestyle, which Luka Mijatovic won.
# Stability: a completed championship result; the placings are settled.
# Source: https://www.nbcsports.com/olympics/news/usa-swimming-national-championships-results-2026
# Source: https://swimswam.com/luka-mijatovic-blasts-343-45-400-free-becomes-5-all-time-us-performer-at-2026-us-nationals
- description: "refuted trap: the third title was the 400m individual medley"
  vars:
    statement: "Ryan Erisman secured three national titles at the 2026 USA Swimming National Championships across the 400m freestyle, 800m freestyle, and 200m freestyle."
    surroundingContext: "The 2026 USA Swimming National Championships featured an exceptional showing from rising talent. Distance and mid-distance freestyle events saw fierce competition, with swimmers posting personal bests. Several swimmers claimed multiple titles across closely related events."
    expectedVerdict: refuted

# Pattern: unstated-causal-link.
# Careless: both halves of the claim are documented, so the causal join between them reads as documented too.
# Correct: the sending-off happened and Mexico won 2-0, but no source supports the claim that one caused the other.
# Stability: a completed match; the competition name is confirmed correct as the CONCACAF U-20 Championship.
# Source: https://www.frontrowsoccer.com/2026/08/10/second-best-10-man-u-s-lose-to-mexico-in-concacaf-u-20-finale/
- description: "unverifiable trap: both halves are documented, the join between them is not"
  vars:
    statement: "The United States lost the 2026 CONCACAF U-20 Championship final 2-0 to Mexico because the team played the entire second half with 10 players after a sending-off in the opening moments."
    surroundingContext: "The 2026 CONCACAF U-20 Championship concluded on August 9 at Estadio Azteca before 36,000 fans. The United States faced Mexico with the winner qualifying for the 2027 FIFA U-20 World Cup. The match unfolded with dramatic turns."
    expectedVerdict: unverifiable

# Three traps, not four. The superseded-figure pattern -- a claim citing a figure that
# was later officially revised -- is not represented, after three attempts to source
# one failed the same test in three disguises. A swimming record was still moving, so
# the right answer moved with it. Everest's 8,848m against its revised 8,848.86m is a
# correct rounding, so `supported` is defensible. A restated GDP figure was measured
# under the standard of its day, so it was never wrong either.
#
# The bar a candidate has to clear: could a reasonable person defend the stale figure
# as still correct? If yes, the case has two defensible answers and cannot be scored
# by exact match.
#
# This leaves one real fact-checker failure -- trusting stale data -- unmeasured by
# this suite. That is a known gap in coverage, not a defect in the cases.

