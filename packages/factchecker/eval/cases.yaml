# The nineteen cases the evaluation suite scores. `promptfooconfig.yaml` holds the
# assertions; every case here is data.
#
# Every claim anchors to a dated event, never to a present state, so a case cannot
# change its own answer and rot the suite.
#
# The refuted cases alter exactly one checkable detail of a real story. The altered
# detail is named in the description, so the expected verdict is defensible rather
# than a matter of taste.
#
# The sources under each case are where its ground truth was read. Nothing reads them
# at run time: they are here for the person re-checking a case the suite marks wrong.
# ---- supported ----

