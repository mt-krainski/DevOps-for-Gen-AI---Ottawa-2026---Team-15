# The LLM quality suite for this package: about twenty cases, run by hand when
# a prompt changes. It is wired to nothing. Every case spends a real OpenRouter
# key and a real Bright Data token, both read from the environment the package
# itself reads. The package README carries the invocation.
description: fact-checker verdict quality

providers:
  - id: "file://provider.py:call_api"

# The provider ignores the prompt. A case is carried by its `vars`, and the
# prompts the run sends are the package's own, in `fact_checker/agent.py`.
# promptfoo requires the key all the same.
prompts:
  - "{{statement}}"

tests: file://cases.yaml

# Every case is held to the wire contract as well as to its own verdict. The
# schema fixes the whole entry, `ruling` and `error` included, so a case that
# passes its verdict assertion on a malformed entry still fails here.
defaultTest:
  assert:
    - type: is-json
      value:
        type: object
        required:
          - id
          - surroundingContext
          - statement
          - classification
          - ruling
          - error
        properties:
          id:
            type: string
          surroundingContext:
            type: string
          statement:
            type: string
          classification:
            type: object
            required: [class, confidence]
            properties:
              class:
                enum: [fact, opinion]
              confidence:
                type: number
                minimum: 0
                maximum: 1
          ruling:
            oneOf:
              - type: "null"
              - type: object
                required: [verdict, confidence, justification, references]
                properties:
                  verdict:
                    enum: [supported, refuted, mixed, unverifiable]
                  confidence:
                    type: number
                    minimum: 0
                    maximum: 1
                  justification:
                    type: string
                  references:
                    type: array
                    items:
                      type: object
                      required: [id, source, excerpt]
                      properties:
                        id:
                          type: string
                        source:
                          type: string
                        excerpt:
                          type: string
          error:
            oneOf:
              - type: "null"
              - type: object
                required: [code, message]
                properties:
                  code:
                    type: string
                  message:
                    type: string
