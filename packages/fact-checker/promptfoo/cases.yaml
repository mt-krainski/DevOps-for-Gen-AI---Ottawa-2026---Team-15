# Twenty cases, spread across the four verdicts, plus two opinions that must
# pass through unchecked. Each `assert` here is the case's own expectation; the
# wire-contract assertion every case also carries lives in the config's
# `defaultTest`.
#
# A case that fails on the model's judgement is a finding about the prompt or
# the model. It is not a reason to loosen the assertion.

# --- supported: the evidence backs the claim ------------------------------

- description: Water's boiling point at one atmosphere
  vars:
    statement: Water boils at 100 degrees Celsius at one atmosphere of pressure.
    surroundingContext: >-
      The chapter opened on the physics of everyday cooking, starting with the
      kettle.
    class: fact
    confidence: 0.95
  assert:
    - type: javascript
      value: JSON.parse(output).ruling?.verdict === 'supported'

