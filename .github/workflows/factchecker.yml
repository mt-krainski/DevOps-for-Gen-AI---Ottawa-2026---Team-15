name: factchecker

# The path filter keeps this package's checks independent of every other package
# in the monorepo: a teammate's change never queues, or fails, this job.
#
# The two actions below are pinned at different depths on purpose. Each sits at
# the version already observed to resolve and run green, and that observation is
# what a bump needs — not a matching depth between the two.
on:
  pull_request:
    paths:
      - "packages/factchecker/**"
      - ".github/workflows/factchecker.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/factchecker

# Nothing here supplies a credential. The package ships a checking agent that
# calls OpenRouter and Bright Data, and no test does: every test drives a fake
# model and a fake tool, and none reaches a network. That is why no step below
# carries an `env` or a `secrets` block, and adding one is the error this comment
# exists to prevent.
jobs:
  checks:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: packages/factchecker/uv.lock

      # uv reads `.python-version` from this package and fetches that
      # interpreter itself, so no separate action provisions one.
      - name: Sync the package
        run: uv sync --locked

      - name: Lint
        run: uv run poe lint

      - name: Test
        run: uv run poe test
