name: factchecker

# The path filter keeps this package's checks independent of every other package
# in the monorepo: a teammate's change never queues, or fails, this job.
on:
  pull_request:
    paths:
      - "packages/factchecker/**"
      - ".github/workflows/factchecker.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/factchecker

# Nothing here supplies a credential and nothing calls a model: every test in
# this package runs against a checker the test injects. That is why no step
# below carries an `env` or a `secrets` block.
jobs:
  checks:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: packages/factchecker/uv.lock

      # uv reads `.python-version` from this package and fetches that
      # interpreter itself, so no separate action provisions one.
      - name: Sync the package
        run: uv sync --locked

      - name: Lint
        run: uv run poe lint

      - name: Test
        run: uv run poe test
