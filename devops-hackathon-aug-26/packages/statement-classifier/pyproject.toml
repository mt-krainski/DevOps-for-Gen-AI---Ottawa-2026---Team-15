[project]
name = "statement-classifier"
version = "0.1.0"
description = "Classifies statements as fact or opinion for the fact-checking pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/statement_classifier"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
